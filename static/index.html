<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 antialiased">

  <!-- Main Container -->
  <div class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-xl p-8 relative overflow-hidden">
    <!-- Ambient Glow Header -->
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-36 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Card Header -->
    <div class="flex items-center justify-between border-b border-slate-800/80 pb-5 mb-6">
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">Personal Profile</h1>
        <p class="text-xs text-slate-400 mt-0.5">Manage your public persona, bio, and avatar</p>
      </div>
      <button id="viewPublicBtn" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition border border-slate-700/60 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Public View
      </button>
    </div>

    <!-- Alert / Toast Banner -->
    <div id="toast" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium transition-all"></div>

    <!-- Profile Form -->
    <form id="profileForm" class="space-y-6">

      <!-- Avatar Section -->
      <div class="flex items-center gap-5">
        <div class="relative group cursor-pointer" id="avatarContainer">
          <img id="avatarImg" src="/static/avatars/default.svg" alt="Avatar" class="w-20 h-20 rounded-2xl object-cover border-2 border-indigo-500/40 shadow-lg bg-slate-800 transition group-hover:brightness-75">
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition rounded-2xl bg-black/40">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
          <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" class="hidden">
        </div>

        <div class="space-y-1.5 flex-1">
          <div class="flex items-center gap-2">
            <button type="button" id="uploadAvatarBtn" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition shadow-sm">
              Upload Image
            </button>
            <button type="button" id="removeAvatarBtn" class="text-xs px-3 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 font-medium border border-rose-800/40 transition">
              Remove
            </button>
          </div>
          <p class="text-[11px] text-slate-500">PNG, JPEG, or WebP up to 5MB. Auto-cropped to 256x256 WebP.</p>
        </div>
      </div>

      <!-- Display Name -->
      <div class="space-y-1.5">
        <label for="displayName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Display Name</label>
        <input type="text" id="displayName" required maxlength="64" class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>

      <!-- Handle (Read-only) -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Username Handle</label>
        <div class="flex items-center px-4 py-2.5 bg-slate-800/30 border border-slate-800 rounded-xl text-sm text-slate-400 select-none">
          <span class="text-slate-600 mr-1">@</span>
          <span id="usernameDisplay">loading...</span>
        </div>
      </div>

      <!-- Biography -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center">
          <label for="bio" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Biography</label>
          <span id="bioCounter" class="text-[11px] text-slate-500 font-mono">0 / 500</span>
        </div>
        <textarea id="bio" rows="4" maxlength="500" placeholder="Tell the community about yourself, your projects, and stack..." class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="saveBtn" class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
        <span>Save Profile</span>
      </button>

    </form>
  </div>

  <!-- Public Profile Modal -->
  <div id="publicModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
      <button id="closeModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="mx-auto w-24 h-24 rounded-full overflow-hidden border-2 border-indigo-500/50 shadow-md">
        <img id="publicAvatarImg" src="/static/avatars/default.svg" class="w-full h-full object-cover">
      </div>
      <div>
        <h3 id="publicDisplayName" class="text-lg font-bold text-white"></h3>
        <p id="publicUsername" class="text-xs text-indigo-400 font-mono"></p>
      </div>
      <p id="publicBio" class="text-xs text-slate-300 leading-relaxed bg-slate-800/40 p-3 rounded-xl border border-slate-800"></p>
      <p class="text-[10px] text-slate-500">Public View (Read-Only via /api/profile/{username})</p>
    </div>
  </div>

  <script>
    const AUTH_HEADER = "Bearer user_yanish";

    const toast = document.getElementById("toast");
    const avatarImg = document.getElementById("avatarImg");
    const avatarInput = document.getElementById("avatarInput");
    const uploadAvatarBtn = document.getElementById("uploadAvatarBtn");
    const removeAvatarBtn = document.getElementById("removeAvatarBtn");
    const avatarContainer = document.getElementById("avatarContainer");
    const displayNameInput = document.getElementById("displayName");
    const usernameDisplay = document.getElementById("usernameDisplay");
    const bioInput = document.getElementById("bio");
    const bioCounter = document.getElementById("bioCounter");
    const profileForm = document.getElementById("profileForm");
    const saveBtn = document.getElementById("saveBtn");
    const viewPublicBtn = document.getElementById("viewPublicBtn");
    const publicModal = document.getElementById("publicModal");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let currentUsername = "";

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = `mb-5 p-3.5 rounded-xl text-xs font-medium transition-all ${
        isError ? "bg-rose-950/70 text-rose-300 border border-rose-800/60" : "bg-emerald-950/70 text-emerald-300 border border-emerald-800/60"
      }`;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 4000);
    }

    function updateCounter() {
      const len = bioInput.value.length;
      bioCounter.textContent = `${len} / 500`;
      bioCounter.className = len > 500 ? "text-[11px] text-rose-400 font-mono font-bold" : "text-[11px] text-slate-500 font-mono";
    }

    bioInput.addEventListener("input", updateCounter);

    // Fetch Profile
    async function loadProfile() {
      try {
        const res = await fetch("/api/profile/me", {
          headers: { "Authorization": AUTH_HEADER }
        });
        if (!res.ok) throw new Error("Failed to load profile");
        const data = await res.json();
        currentUsername = data.username;
        usernameDisplay.textContent = data.username;
        displayNameInput.value = data.displayName || "";
        bioInput.value = data.bio || "";
        avatarImg.src = data.avatarUrl || "/static/avatars/default.svg";
        updateCounter();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Save Profile
    profileForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.innerHTML = "Saving...";
      try {
        const res = await fetch("/api/profile/me", {
          method: "PUT",
          headers: {
            "Authorization": AUTH_HEADER,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            displayName: displayNameInput.value,
            bio: bioInput.value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to update profile");
        showToast("Profile updated successfully!");
        avatarImg.src = data.avatarUrl;
      } catch (err) {
        showToast(err.message, true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = "Save Profile";
      }
    });

    // Avatar Upload Trigger
    uploadAvatarBtn.addEventListener("click", () => avatarInput.click());
    avatarContainer.addEventListener("click", () => avatarInput.click());

    avatarInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        showToast("Image exceeds maximum 5MB limit", true);
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      showToast("Processing avatar...");
      try {
        const res = await fetch("/api/profile/me/avatar", {
          method: "POST",
          headers: { "Authorization": AUTH_HEADER },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Upload failed");
        avatarImg.src = data.avatarUrl + "?t=" + Date.now();
        showToast("Avatar updated successfully!");
      } catch (err) {
        showToast(err.message, true);
      } finally {
        avatarInput.value = "";
      }
    });

    // Remove Avatar
    removeAvatarBtn.addEventListener("click", async () => {
      try {
        const res = await fetch("/api/profile/me/avatar", {
          method: "DELETE",
          headers: { "Authorization": AUTH_HEADER }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to remove avatar");
        avatarImg.src = data.avatarUrl;
        showToast("Avatar removed and reset to default");
      } catch (err) {
        showToast(err.message, true);
      }
    });

    // Public Profile Modal
    viewPublicBtn.addEventListener("click", async () => {
      if (!currentUsername) return;
      try {
        const res = await fetch(`/api/profile/${currentUsername}`);
        if (!res.ok) throw new Error("Could not fetch public profile");
        const data = await res.json();
        document.getElementById("publicAvatarImg").src = data.avatarUrl;
        document.getElementById("publicDisplayName").textContent = data.displayName;
        document.getElementById("publicUsername").textContent = `@${data.username}`;
        document.getElementById("publicBio").textContent = data.bio || "(No bio provided)";
        publicModal.classList.remove("hidden");
        publicModal.classList.add("flex");
      } catch (err) {
        showToast(err.message, true);
      }
    });

    closeModalBtn.addEventListener("click", () => {
      publicModal.classList.add("hidden");
      publicModal.classList.remove("flex");
    });

    window.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
